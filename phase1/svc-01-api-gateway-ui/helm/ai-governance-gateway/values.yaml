namespace: gov-edge
environment: trl5

replicaCount: 1

image:
  repository: localhost/ai-governance-svc-01-api-gateway-ui
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8084
  targetPort: 8084

containerPort: 8084

env:
  PORT: "8084"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  httpGet:
    path: /health
    port: 8084
    scheme: HTTP
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8084
    scheme: HTTP
  initialDelaySeconds: 20
  periodSeconds: 20

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

terminationGracePeriodSeconds: 30
