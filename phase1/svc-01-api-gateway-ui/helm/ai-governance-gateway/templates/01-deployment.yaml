apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-governance-gateway.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ai-governance-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-governance-gateway.name" . }}
      app.kubernetes.io/component: api-gateway-ui
  template:
    metadata:
      labels:
        {{- include "ai-governance-gateway.labels" . | nindent 8 }}
    spec:
      containers:
        - name: api-gateway-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              protocol: TCP
              name: http
          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
